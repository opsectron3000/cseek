[workspace]
resolver = "2"
members = ["crates/proto", "crates/core", "crates/daemon", "crates/mockserver"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
slsk-proto = { path = "crates/proto" }
cseek-core = { path = "crates/core" }
anyhow = "1"
thiserror = "2"
tokio = { version = "1.52", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
flate2 = "1"
